name: feature/* to develop PR terraform lifecycle

on:
  pull_request:
    branches:
      - develop
  pull_request_target:
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:

  plan:
    if: startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sanitize branch name
        id: sanitize
        run: |
          RAW="${{ github.head_ref }}"
          CLEAN=$(echo "$RAW" | sed 's/\//--/g')
          echo "clean_branch=$CLEAN" >> $GITHUB_OUTPUT

      - name: Build RG name
        id: rg
        run: |
          echo "name=rg-${{ steps.sanitize.outputs.clean_branch }}" >> $GITHUB_OUTPUT

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan -var "resource_group_name=${{ steps.rg.outputs.name }}"
        working-directory: ./terraform


  apply:
    if: startsWith(github.head_ref, 'feature/') && contains(github.event.pull_request.labels.*.name, 'apply')
    needs: plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        run: terraform apply -auto-approve -var "resource_group_name=${{ needs.plan.outputs.rg_name }}"
        working-directory: ./terraform


  destroy:
    if: github.event.action == 'closed' && startsWith(github.event.pull_request.head.ref, 'feature/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var "resource_group_name=rg-${{ github.event.pull_request.head.ref }}"
        working-directory: ./terraform
